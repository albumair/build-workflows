name: Reusable Node image build

on:
  workflow_call:

permissions: {}

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # Full commit pins are mandatory because this job can publish packages
      # and obtain an OIDC token in the calling repository's identity context.
      - name: Check out caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false

      - name: Test
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Derive caller-owned image references
        id: refs
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          package="${GITHUB_REPOSITORY#*/}"
          package="${package,,}"
          short_sha="${GITHUB_SHA:0:12}"
          [[ "$owner" =~ ^[a-z0-9][a-z0-9.-]*$ ]]
          [[ "$package" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          echo "image=ghcr.io/${owner}/${package}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Log in to caller GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push unsigned image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          push: true
          tags: |
            ${{ steps.refs.outputs.image }}:main
            ${{ steps.refs.outputs.image }}:sha-${{ steps.refs.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true

      # A failed scan can leave an unsigned image, but the admission boundary
      # must reject it because signing occurs only after the scan succeeds.
      - name: Scan image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.refs.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          version: v0.69.3
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image digest with GitHub OIDC
        env:
          COSIGN_YES: "true"
          IMAGE: ${{ steps.refs.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign "${IMAGE}@${DIGEST}"

      - name: Capture sanitized OIDC claims
        shell: bash
        run: |
          mkdir -p evidence
          curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" \
            | node scripts/extract-oidc-claims.mjs \
            > evidence/oidc-claims.json

      # The certificate SAN for a reusable workflow is the called workflow's
      # job_workflow_ref. Validate its protected repository/path shape first,
      # then require Cosign to match the exact observed full-SHA identity.
      - name: Verify signature and record certificate
        env:
          IMAGE: ${{ steps.refs.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          job_workflow_ref="$(jq -r '.job_workflow_ref // empty' evidence/oidc-claims.json)"
          [[ "$job_workflow_ref" =~ ^albumair/build-workflows/\.github/workflows/build\.yml@[0-9a-f]{40}$ ]]
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${job_workflow_ref}" \
            --output json > evidence/cosign-verification.json

      - name: Assemble release evidence
        env:
          IMAGE: ${{ steps.refs.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/write-release-evidence.mjs

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghcr-release-evidence-${{ steps.refs.outputs.short_sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Publish run summary
        env:
          IMAGE: ${{ steps.refs.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Signed GHCR image"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo "Deploy this immutable reference; do not deploy the moving \`main\` tag."
          } >> "$GITHUB_STEP_SUMMARY"
